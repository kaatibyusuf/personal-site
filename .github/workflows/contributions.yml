name: Update contribution graph
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch contributions
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: node scripts/fetch-contributions.js
      - name: Commit if changed
        run: |
          git config user.name "contributions-bot"
          git config user.email "actions@users.noreply.github.com"
          git add contributions.json
          git diff --staged --quiet || (git commit -m "Update contribution graph" && git push)
